# ==============================================================
# IoT Dashboard - Spring Boot Application Properties
# ==============================================================

server.port=5000

# --------------------------------------------------------------
# 1. H2 IN-MEMORY DATABASE (Mặc định: Chạy mượt mà khi chưa có MySQL)
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:iot_dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Bật H2 Web Console (Truy cập http://localhost:5000/h2-console để xem bảng)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --------------------------------------------------------------
# 2. MQTT BROKER CONFIGURATION (Khớp với sketch ESP32)
# --------------------------------------------------------------
# Mặc định kết nối broker laptop/hotspot (ví dụ 172.20.10.6 hoặc localhost)
mqtt.broker.url=tcp://127.0.0.1:1883
mqtt.client.id=SpringBootBackendClient
mqtt.username=admin
mqtt.password=123456

# MQTT Topics (Khớp chính xác với ESP32)
mqtt.topic.sensor=data/sensors
mqtt.topic.control=device/control
mqtt.topic.status=device/status

# Tự động mô phỏng phản hồi khi chưa bật MQTT Broker (để test web không bị treo)
mqtt.simulation.enabled=true

# --------------------------------------------------------------
# 3. CORS & LOGGING
# --------------------------------------------------------------
logging.level.com.iot.dashboard=INFO
logging.level.org.springframework.web=INFO
