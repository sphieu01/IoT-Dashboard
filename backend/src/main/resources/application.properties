# IoT Dashboard - Spring Boot Application Properties
# Cổng mạng
server.port=5000

# MySQL
spring.profiles.active=mysql

# 1. MYSQL DATABASE CONFIGURATION (Mặc định kết nối MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/iot_dashboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# 2. MQTT BROKER CONFIGURATION (Khớp với sketch ESP32)
# Mặc định kết nối broker laptop/hotspot (ví dụ 172.20.10.6 hoặc localhost)
mqtt.broker.url=tcp://127.0.0.1:1883
mqtt.client.id=SpringBootBackendClient
mqtt.username=admin
mqtt.password=123456

# MQTT Topics (Khớp chính xác với ESP32)
mqtt.topic.sensor=data/sensors
mqtt.topic.control=device/control
mqtt.topic.status=device/status

# Tự động mô phỏng phản hồi khi chưa bật MQTT Broker
mqtt.simulation.enabled=false


# 3. CORS & LOGGING
logging.level.com.iot.dashboard=INFO
logging.level.org.springframework.web=INFO
# mức độ ghi log là INFO, thay vì DEBUG nhiều
