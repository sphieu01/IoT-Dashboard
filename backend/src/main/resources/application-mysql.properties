# ==============================================================
# IoT Dashboard - MySQL Profile Configuration
# Kích hoạt bằng cách đổi 'spring.profiles.active=mysql' trong application.properties
# hoặc chạy lệnh: .\mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ==============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/iot_dashboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
